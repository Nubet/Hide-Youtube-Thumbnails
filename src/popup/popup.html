<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hide YouTube Thumbnails</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">hide-youtube-thumbnails</h1>
      <p id="page-status">Loading page status...</p>

      <label>
        <input id="enabled" type="checkbox" />
        Enable thumbnail hiding
      </label>

      <label for="mode">Thumbnail mode</label>
      <select id="mode">
        <option value="hidden">Hidden</option>
        <option value="hidden-except-hover">Hidden except hover</option>
        <option value="blurred">Blurred</option>
        <option value="solid-color">Solid color</option>
        <option value="normal">Normal</option>
      </select>

      <section class="channel-action" aria-labelledby="channel-action-title">
        <h2 id="channel-action-title">Channel thumbnail exception</h2>
        <p id="channel-action-help">
          Show thumbnails only while browsing this channel's Videos tab. They stay hidden
          everywhere else.
        </p>
        <button id="channel-action" type="button">Show thumbnails for this channel's videos</button>
      </section>

      <section class="channel-list" aria-labelledby="channel-list-title">
        <h2 id="channel-list-title">Saved channel exceptions</h2>
        <p>Thumbnails are shown only on each channel's <strong>/videos</strong> page.</p>
        <div class="channel-entry">
          <label for="channel-url">Add a channel's Videos URL</label>
          <div class="input-row">
            <input
              id="channel-url"
              type="url"
              inputmode="url"
              placeholder="youtube.com/@example/videos"
              autocomplete="off"
            />
            <button id="add-channel" type="button">Add</button>
          </div>
        </div>
        <ul id="channel-list" aria-live="polite"></ul>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
