<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debait - Hide YouTube Thumbnail</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <img class="app-logo" src="../../icons/icon128.png" alt="" width="32" height="32" />
        <h1 id="title">Hide YT Thumbnails</h1>
      </div>
    </header>

    <main aria-labelledby="title">
      <div class="settings-group">
        <label class="setting-item" for="enabled">
          <div class="setting-content">
            <span class="setting-title">Enable extension</span>
            <span class="setting-desc">Toggle all thumbnail hiding</span>
          </div>
          <div class="toggle">
            <input id="enabled" type="checkbox" />
            <span class="slider"></span>
          </div>
        </label>

        <div class="setting-item column">
          <div class="setting-content">
            <label class="setting-title" for="mode">Thumbnail mode</label>
          </div>
          <div class="select-wrapper">
            <select id="mode">
              <option value="hidden">Hidden completely</option>
              <option value="hidden-except-hover">Hidden except hover</option>
              <option value="blurred">Blurred</option>
              <option value="solid-color">Solid color</option>
              <option value="normal">Normal (Visible)</option>
            </select>
          </div>
        </div>
      </div>

      <section class="settings-group current-page-card" aria-labelledby="current-page-title">
        <div class="section-header">
          <p class="eyebrow">Current YouTube page</p>
          <h2 id="current-page-title">Checking page...</h2>
          <p id="current-page-help" class="section-desc">You can turn the extension off for this page only.</p>
        </div>
        <label id="current-page-control" class="setting-item" for="current-page-enabled" hidden>
          <span class="setting-content">
            <span class="setting-title">Run on this page</span>
            <span class="setting-desc">This does not change the global switch.</span>
          </span>
          <span class="toggle">
            <input id="current-page-enabled" type="checkbox" />
            <span class="slider"></span>
          </span>
        </label>
      </section>

      <section class="settings-group exceptions" aria-labelledby="channel-list-title">
        <div class="section-header">
          <h2 id="channel-list-title">Channel Exceptions</h2>
          <p class="section-desc">Show thumbnails on specific channel pages.</p>
        </div>

        <div class="channel-action-card">
          <p id="channel-action-help">Open a YouTube channel page or its Videos tab to add it.</p>
          <button id="channel-action" class="primary-button" type="button">Show thumbnails for this channel</button>
        </div>
      </section>

      <button id="open-options" class="secondary-button" style="width: 100%;">
        Open full settings
      </button>

      <div class="status-container">
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
