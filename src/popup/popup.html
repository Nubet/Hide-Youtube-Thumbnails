<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hide YouTube Thumbnails</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <img class="app-logo" src="../../icons/icon128.png" alt="" width="32" height="32" />
        <h1 id="title">Hide YT Thumbnails</h1>
      </div>
    </header>

    <main aria-labelledby="title">
      <div class="settings-group">
        <label class="setting-item" for="enabled">
          <div class="setting-content">
            <span class="setting-title">Enable extension</span>
            <span class="setting-desc">Toggle all thumbnail hiding</span>
          </div>
          <div class="toggle">
            <input id="enabled" type="checkbox" />
            <span class="slider"></span>
          </div>
        </label>

        <div class="setting-item column">
          <div class="setting-content">
            <label class="setting-title" for="mode">Thumbnail mode</label>
            <span class="setting-desc">How should thumbnails be hidden?</span>
          </div>
          <div class="select-wrapper">
            <select id="mode">
              <option value="hidden">Hidden completely</option>
              <option value="hidden-except-hover">Hidden except hover</option>
              <option value="blurred">Blurred</option>
              <option value="solid-color">Solid color</option>
              <option value="normal">Normal (Visible)</option>
            </select>
          </div>
          <div id="solid-color-control" class="solid-color-control" hidden>
            <label for="solid-color">
              <span class="setting-title">Solid color</span>
              <span class="setting-desc">Choose the color used in place of thumbnails.</span>
            </label>
            <div class="color-picker">
              <input id="solid-color" type="color" aria-label="Choose solid thumbnail color" />
              <output id="solid-color-value" for="solid-color"></output>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-group">
        <label class="setting-item" for="hide-shorts-on-home">
          <div class="setting-content">
            <span class="setting-title">Hide Shorts on Home</span>
            <span class="setting-desc">Removes Shorts shelf from home page</span>
          </div>
          <div class="toggle">
            <input id="hide-shorts-on-home" type="checkbox" />
            <span class="slider"></span>
          </div>
        </label>

        <label class="setting-item" for="hide-playables">
          <div class="setting-content">
            <span class="setting-title">Hide Playables</span>
            <span class="setting-desc">Removes Game Room & Playables</span>
          </div>
          <div class="toggle">
            <input id="hide-playables" type="checkbox" />
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <section class="settings-group exceptions" aria-labelledby="channel-list-title">
        <div class="section-header">
          <h2 id="channel-list-title">Channel Exceptions</h2>
          <p class="section-desc">Show thumbnails on specific channel pages.</p>
        </div>

        <div class="channel-action-card">
          <p id="channel-action-help">Open a YouTube channel page or its Videos tab to add it.</p>
          <button id="channel-action" class="primary-button" type="button">Show thumbnails for this channel</button>
        </div>

        <div class="channel-entry">
          <div class="input-row">
            <input
              id="channel-url"
              type="url"
              inputmode="url"
              placeholder="youtube.com/@example"
              autocomplete="off"
            />
            <button id="add-channel" class="secondary-button" type="button">Add</button>
          </div>
        </div>
        <ul id="channel-list" aria-live="polite"></ul>
      </section>

      <div class="status-container">
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
