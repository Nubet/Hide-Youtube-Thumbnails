name: Release Debait extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;

          for (const file of ["package.json", "package-lock.json", "manifest.json"]) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          }
          NODE

      - name: Commit version and create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          RELEASE_TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:main
          fi

          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi

          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.VERSION;

          for (const file of ["package.json", "package-lock.json", "manifest.json"]) {
            const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (actual !== expected) {
              console.error(`${file} has version ${actual}; expected ${expected}`);
              process.exit(1);
            }
          }
          NODE

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build browser packages
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          npm run build:page

          for browser in chrome edge firefox; do
            npx extension build \
              --browser "$browser" \
              --zip \
              --zip-filename "debait-hide-youtube-thumbnail-${TAG_NAME}-${browser}.zip" \
              --silent
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME"
          dist/chrome/*.zip
          dist/edge/*.zip
          dist/firefox/*.zip
          --repo "${GITHUB_REPOSITORY}"
          --title "Debait - Hide YouTube Thumbnail $TAG_NAME"
          --generate-notes
          --verify-tag
